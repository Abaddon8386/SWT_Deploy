scms:
  ai:
    provider: ${SCMS_AI_PROVIDER:mock}
    api-key: ${SCMS_AI_API_KEY:}
    model: ${SCMS_AI_MODEL:}
    chat:
      provider: ${SCMS_AI_CHAT_PROVIDER:${SCMS_AI_PROVIDER:disabled}}
      api-key: ${SCMS_AI_CHAT_API_KEY:${SCMS_AI_API_KEY:}}
      model: ${SCMS_AI_CHAT_MODEL:${SCMS_AI_MODEL:}}

server:
  port: 8080
  servlet:
    session:
      timeout: 5m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:200ms}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      "[sasl.mechanism]": ${KAFKA_SASL_MECHANISM:PLAIN}
      "[sasl.jaas.config]": ${KAFKA_SASL_JAAS_CONFIG:}
    admin:
      auto-create: ${APP_NOTIFICATIONS_KAFKA_CREATE_TOPIC:false}
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[max.block.ms]": 3000
        "[delivery.timeout.ms]": 10000
        "[request.timeout.ms]": 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 25
  profiles:
    default: supabase
  application:
    name: scms-api
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl.halt_on_error: true
        default_batch_fetch_size: 50
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    filter: true

app:
  performance:
    catalog-cache:
      enabled: ${APP_CATALOG_CACHE_ENABLED:false}
      # Unique per deployment AND database schema; never share staging and production namespaces.
      namespace: ${APP_CATALOG_CACHE_NAMESPACE:scms:local:public-catalog}
      ttl: ${APP_CATALOG_CACHE_TTL:60s}
      failure-backoff: ${APP_CATALOG_CACHE_FAILURE_BACKOFF:5s}
  notifications:
    kafka:
      enabled: ${APP_NOTIFICATIONS_KAFKA_ENABLED:false}
      topic: ${APP_NOTIFICATIONS_KAFKA_TOPIC:scms.local.notification-delivery.v1}
      group-id: ${APP_NOTIFICATIONS_KAFKA_GROUP_ID:scms-local-notification-delivery-v1}
      create-topic: ${APP_NOTIFICATIONS_KAFKA_CREATE_TOPIC:false}
      topic-replicas: ${APP_NOTIFICATIONS_KAFKA_TOPIC_REPLICAS:1}
      batch-size: 25
      poll-delay: 1000
      retry-delay: 60s
      send-timeout: 5s
      retention: 7d
      cleanup-delay: 3600000
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
    chat-jwt-secret: ${SUPABASE_CHAT_JWT_SECRET:}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
  qr:
    secret: ${APP_QR_SECRET:${APP_JWT_SECRET}}
    ttl-seconds: ${APP_QR_TTL_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    web-origin: ${APP_WEB_ORIGIN:http://localhost:5173}
  auth:
    debug-otp-enabled: ${APP_AUTH_DEBUG_OTP_ENABLED:false}
    otp:
      delivery: ${APP_OTP_DELIVERY:disabled}
      from-address: ${SMTP_FROM:no-reply@example.invalid}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  scheduler:
    package-expiry:
      cron: ${APP_SCHEDULER_PACKAGE_EXPIRY_CRON:0 0 8 * * ?}
    class-reminder:
      cron: ${APP_SCHEDULER_CLASS_REMINDER_CRON:0 */30 * * * ?}
