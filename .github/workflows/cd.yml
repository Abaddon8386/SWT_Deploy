# CD = Continuous Deployment: tự đưa code lên môi trường thật sau khi CI đã xanh.
#
# Luồng chạy:
#   push vào main -> CI xanh -> CD: [1] deploy backend (Render) -> [2] deploy frontend (Vercel)
# Backend lỗi thì frontend không được deploy, tránh giao diện mới gọi API chưa sẵn sàng.
#
# MẪU DÙNG CHO DỰ ÁN React + Spring Boot, backend ở Render, frontend ở Vercel.
#   - Chưa có secret của Render  -> bước backend tự bỏ qua.
#   - Chưa có secret của Vercel  -> bước frontend tự bỏ qua.
#   - Chưa có cả hai             -> CD không làm gì (không báo lỗi), nên copy sang dự án mới vẫn an toàn.
# Dự án khác chỉ cần: đổi nhánh `branches`, `HEALTH_PATH`, và thêm Secrets/Variables theo docs/CICD_SETUP.md.
name: CD

on:
  workflow_run:
    workflows: [CI]        # phải trùng với "name" trong ci.yml
    types: [completed]
    branches: [main]       # nhánh production

permissions:
  contents: read

# Chỉ một lần deploy production tại một thời điểm; lần mới đợi lần đang chạy xong.
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  # Mã commit (SHA) mà CI vừa kiểm tra xong; mọi bước dưới đều deploy đúng commit này.
  COMMIT: ${{ github.event.workflow_run.head_sha }}
  # Đường dẫn health check của backend. Spring Boot Actuator mặc định là /actuator/health.
  # Có thể ghi đè bằng Variable BACKEND_HEALTH_PATH mà không cần sửa file này.
  HEALTH_PATH: ${{ vars.BACKEND_HEALTH_PATH || '/api/v1/health' }}

jobs:
  # ---------- Bước 0: quyết định có deploy không, deploy phần nào ----------
  config:
    name: Check CI result and deploy targets
    # Chỉ chạy khi CI xanh, đến từ push/chạy tay trên chính repo này (không nhận CI của PR hay fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      render: ${{ steps.targets.outputs.render }}
      vercel: ${{ steps.targets.outputs.vercel }}
    steps:
      - id: targets
        run: |
          echo "render=${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}" >> "$GITHUB_OUTPUT"
          echo "vercel=${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}" >> "$GITHUB_OUTPUT"

  # ---------- Bước 1: backend lên Render ----------
  backend:
    name: Deploy backend to Render
    needs: config
    if: needs.config.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy and wait until live
        shell: bash
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" "$@"; }
          service="https://api.render.com/v1/services/$RENDER_SERVICE_ID"

          # Yêu cầu Render deploy đúng commit mà CI vừa kiểm tra.
          deploy_id=$(api -X POST "$service/deploys" -d "{\"commitId\":\"$COMMIT\"}" | jq -er '(.deploy // .).id')
          echo "Render deploy $deploy_id cho commit ${COMMIT:0:7}"

          # Hỏi trạng thái mỗi 15 giây, tối đa 30 phút.
          status=""
          for _ in $(seq 1 120); do
            status=$(api "$service/deploys/$deploy_id" | jq -er '(.deploy // .).status')
            echo "Trạng thái: $status"
            case "$status" in
              live) break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy kết thúc với trạng thái $status"; exit 1 ;;
            esac
            sleep 15
          done
          [ "$status" = "live" ] || { echo "::error::Quá 30 phút mà Render chưa live"; exit 1; }

      # "live" chỉ là Render báo xong; gọi thử health check để chắc API thật sự trả lời.
      - name: Check backend health
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | jq -er '(.service // .).serviceDetails.url')
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "${url%/}$HEALTH_PATH" | jq -e '.status == "UP"' >/dev/null; then
              echo "Backend khỏe: $url"; exit 0
            fi
            echo "Lần $i/12 chưa ổn, thử lại sau 5 giây"; sleep 5
          done
          echo "::error::Backend không phản hồi $HEALTH_PATH"; exit 1

  # ---------- Bước 2: frontend lên Vercel ----------
  frontend:
    name: Deploy frontend to Vercel
    needs: [config, backend]
    # Chạy khi: có cấu hình Vercel, và backend hoặc thành công hoặc không được dùng (bị bỏ qua).
    # Backend lỗi thì frontend không chạy.
    if: >-
      !cancelled() && needs.config.result == 'success' && needs.config.outputs.vercel == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # đúng commit đã qua CI
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ghim phiên bản x.y.z qua Variable VERCEL_CLI_VERSION để mỗi lần chạy giống nhau.
      # Chưa đặt thì dùng bản mới nhất (tiện cho dự án mới, nhưng nên ghim khi lên production).
      - name: Install Vercel CLI
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION || 'latest' }}
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # Chạy từ gốc repo; Root Directory của project Vercel (vd apps/web) cấu hình trên Vercel.
      - name: Deploy to production
        run: |
          vercel pull --yes --environment=production   # lấy cấu hình production từ Vercel
          vercel build --prod                          # build giao diện
          vercel deploy --prebuilt --prod              # đưa bản build lên production
      # Tùy chọn: đặt Variable FRONTEND_URL (vd https://ten-mien.vercel.app) để kiểm tra trang chủ sau deploy.
      - name: Check frontend responds
        if: vars.FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$FRONTEND_URL" | grep -q 'id="root"'; then
              echo "Frontend khỏe: $FRONTEND_URL"; exit 0
            fi
            echo "Lần $i/12 chưa ổn, thử lại sau 5 giây"; sleep 5
          done
          echo "::error::Frontend không phản hồi"; exit 1
