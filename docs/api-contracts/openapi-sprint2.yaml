  /classes/sessions/{id}/enroll:
    post:
      summary: Đăng ký tham gia buổi học (MEMBER)
      description: |
        Chỉ nhận buổi scheduled có thời điểm bắt đầu trong tương lai, theo Asia/Ho_Chi_Minh.
        Một subscription active phải bao phủ cả ngày đặt hiện tại và ngày diễn ra buổi học;
        startDate/endDate được tính inclusive. Không ghép quyền với kỳ gia hạn tương lai.
        Claim chỗ notified dùng cùng endpoint và được kiểm tra lại các điều kiện này;
        thời hạn giữ chỗ 24 giờ không thay đổi.
        Legacy persistence vẫn gắn enrollment với classId, không phải sessionId;
        kiểm tra ngày chỉ áp dụng cho session được yêu cầu, không cam kết mọi session của lớp.
        Trigger kiểm tra membership theo ngày Việt Nam hiện tại; ngày session do service kiểm tra.
      tags: [Enrollments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClassEnrollmentDto'
