openapi: 3.0.3
info:
  title: SCMS API - Sprint 2 Contract (Notifications, Support, Subscriptions, Scheduling & Check-in)
  version: 1.0.0
  description: >
    API contracts for Sprint 2 features:
    - Module I1: In-App Notification Module (SCRUM-67)
    - Module I2: Support Requests / Tickets Module (SCRUM-68)
    - Module M1: Membership Subscriptions (SCRUM-71)
    - Module S1-S3: Classes, Sessions, Enrollments & Waitlists (SCRUM-72, SCRUM-73, SCRUM-74)
    - Module A1: Center QR Check-in & Attendance (SCRUM-75)
    - Module F1: Member payment requests and own payment history (SCRUM-76)
    All endpoints require Bearer JWT authentication and enforce RBAC via @PreAuthorize.
    Responses are wrapped in the standard ApiResponse payload.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        message:
          type: string
          description: Localized message (vi/en)
        code:
          type: string
          description: Error code when success is false
        data:
          description: Payload
        details:
          description: Validation or error details
        timestamp:
          type: string
          format: date-time

    PaymentRequest:
      type: object
      required: [memberId, amount, method]
      description: >
        A MEMBER must supply their own memberId and at least one owned subscriptionId or
        classEnrollmentId. Subscription payments must match the package price and target
        a pending_payment subscription. Member status must be pending or null; paidAt and
        receivedById must be null. Staff may use the existing cashier workflow.
      properties:
        memberId: {type: integer, format: int64}
        subscriptionId: {type: integer, format: int64, nullable: true}
        classEnrollmentId: {type: integer, format: int64, nullable: true}
        amount: {type: number, minimum: 0, exclusiveMinimum: true}
        method: {type: string, enum: [cash, pos, bank_transfer, online_wallet]}
        status: {type: string, enum: [pending, success, failed, refunded], default: pending, nullable: true}
        paidAt: {type: string, format: date-time, nullable: true}
        receivedById: {type: integer, format: int64, nullable: true}
        note: {type: string, nullable: true}
    PaymentDto:
      type: object
      properties:
        id: {type: integer, format: int64}
        memberId: {type: integer, format: int64}
        memberName: {type: string}
        subscriptionId: {type: integer, format: int64, nullable: true}
        classEnrollmentId: {type: integer, format: int64, nullable: true}
        amount: {type: number}
        method: {type: string, enum: [cash, pos, bank_transfer, online_wallet]}
        status: {type: string, enum: [pending, success, failed, refunded]}
        paidAt: {type: string, format: date-time, nullable: true}
        receivedById: {type: integer, format: int64, nullable: true}
        receivedByName: {type: string, nullable: true}
        note: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        invoiceNumber: {type: string, nullable: true}

    # --- Notifications Schemas ---
    NotificationDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [schedule_change, package_expiry, class_reminder, system, support_reply, payment]
        relatedEntityType:
          type: string
          nullable: true
        relatedEntityId:
          type: integer
          format: int64
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UnreadCountDto:
      type: object
      properties:
        count:
          type: integer
          format: int64

    # --- Support Requests Schemas ---
    CreateSupportRequestDto:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string
          maxLength: 150
          example: "Kẹt tủ đồ phòng thay đồ nam"
        description:
          type: string
          nullable: true
          example: "Tủ số 12 bị kẹt ổ khóa không mở được"

    UpdateSupportRequestStatusDto:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
          example: "in_progress"
        assignedTo:
          type: integer
          format: int64
          nullable: true
          example: 2

    SupportRequestDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        memberName:
          type: string
        assignedTo:
          type: integer
          format: int64
          nullable: true
        assignedToName:
          type: string
          nullable: true
        subject:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true



    CreateSupportMessageDto:
      type: object
      required:
        - message
      description: >-
        clientMessageId is an optional UUID idempotency key scoped to ticket and sender.
        Retry the same key and trimmed content to return the original message without
        duplicate notification or event, including after closure. Changed content with
        the same key returns 409 SUPPORT_MESSAGE_KEY_REUSED. New messages to closed
        tickets return 400 TICKET_CLOSED. Send and status writes share the ticket lock.
      properties:
        clientMessageId:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 2000
          example: "Toi da thu mo lai nhung van chua duoc."

    SupportRequestMessageDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        supportRequestId:
          type: integer
          format: int64
        senderId:
          type: integer
          format: int64
        senderName:
          type: string
        senderRole:
          type: string
          example: "MEMBER"
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    # --- Membership Subscriptions Schemas (SCRUM-71) ---
    SubscriptionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        packageId:
          type: integer
          format: int64
        packageName:
          type: string
        previousSubscriptionId:
          type: integer
          format: int64
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Ngày kết thúc kỳ hiện tại, dùng kiểm tra quyền và QR.
        paidThroughDate:
          type: string
          format: date
          nullable: true
          description: GET /memberships/subscriptions/my trả hạn cuối chuỗi gia hạn cùng gói, liên tiếp và đã thanh toán (status active), bao gồm kỳ hiện tại. Không cộng pending_payment, frozen, cancelled, kỳ có khoảng trống hoặc chuỗi phân nhánh. Các response khác có thể trả null; client dùng endDate khi null. Không thay đổi ngày hoặc QR của từng kỳ.
        status:
          type: string
          enum: [pending_payment, active, frozen, expired, cancelled]
        qrCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        holdStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          nullable: true
        holdReason:
          type: string
          nullable: true
        holdRequestedAt:
          type: string
          format: date-time
          nullable: true
        holdResolvedAt:
          type: string
          format: date-time
          nullable: true

    SubscriptionCreateRequest:
      type: object
      required:
        - packageId
      properties:
        packageId:
          type: integer
          format: int64

    SubscriptionUpgradeRequest:
      type: object
      required:
        - packageId
      properties:
        packageId:
          type: integer
          format: int64

    SubscriptionHoldRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          maxLength: 500
    # --- Scheduling Schemas (SCRUM-72, 73, 74) ---
    CreateClassRequest:
      type: object
      required:
        - name
        - disciplineId
        - coachId
        - roomId
        - capacity
      properties:
        name:
          type: string
          maxLength: 150
        disciplineId:
          type: integer
          format: int64
        coachId:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
        capacity:
          type: integer
          minimum: 1
        level:
          type: string
          enum: [beginner, intermediate, advanced, all]
          default: all
        description:
          type: string

    CreateSessionRequest:
      type: object
      description: Buổi học phải bắt đầu sau thời điểm hiện tại của server; endTime phải sau startTime.
      required:
        - sessionDate
        - startTime
        - endTime
      properties:
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    GymClassDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        disciplineId:
          type: integer
          format: int64
        disciplineName:
          type: string
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        capacity:
          type: integer
        level:
          type: string
        status:
          type: string
        description:
          type: string

    ClassSessionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        classId:
          type: integer
          format: int64
        className:
          type: string
        disciplineId:
          type: integer
          format: int64
        disciplineName:
          type: string
        coachId:
          type: integer
          format: int64
        coachName:
          type: string
        roomId:
          type: integer
          format: int64
        roomName:
          type: string
        sessionDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          type: string
        cancelReason:
          type: string
          nullable: true
        capacity:
          type: integer
        bookedCount:
          type: integer
          format: int64

    ClassEnrollmentDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        classId:
          type: integer
          format: int64
        className:
          type: string
        coachName:
          type: string
          nullable: true
        roomName:
          type: string
          nullable: true
        sessionDate:
          type: string
          format: date
          nullable: true
        startTime:
          type: string
          format: time
          nullable: true
        endTime:
          type: string
          format: time
          nullable: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          nullable: true

    DynamicQrDto:
      type: object
      required: [qrCode, expiresInSeconds, generatedAt]
      properties:
        qrCode:
          type: string
          description: Short-lived HMAC-signed payload DYN:{userId}:{subscriptionId}:{timestampMillis}:{signature}
        expiresInSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Configured lifetime of the returned QR code in seconds
        generatedAt:
          type: string
          format: date-time

    ClassWaitlistDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        classId:
          type: integer
          format: int64
        className:
          type: string
        status:
          type: string
        requestedAt:
          type: string
          format: date-time
        reservationExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Deadline for a notified member to claim their reserved seat

    # --- Attendance / Check-in Schemas (SCRUM-75) ---
    CheckinDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
          nullable: true
        memberName:
          type: string
          nullable: true
        checkInTime:
          type: string
          format: date-time
        checkOutTime:
          type: string
          format: date-time
          nullable: true
        method:
          type: string
          enum: [qr, manual]
        gate:
          type: string
          nullable: true
        status:
          type: string
          enum: [GRANTED, DENIED]
        denialReason:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
          description: Ảnh hội viên, chỉ có trong kết quả quét GRANTED khi hồ sơ có ảnh.
        packageName:
          type: string
          nullable: true
          description: Tên gói được quét, chỉ có trong kết quả quét GRANTED.
        remainingDays:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Số ngày từ ngày quét đến ngày hết hạn; bằng 0 vào ngày hết hạn. Chỉ có trong kết quả quét GRANTED.

    CheckinScanRequest:
      type: object
      required:
        - qrCode
      properties:
        qrCode:
          type: string
          example: "QR-UUID-SUBSCRIPTION"
        gate:
          type: string
          maxLength: 50
          nullable: true
          example: "Cổng chính A"

    AuditLogDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        userFullName:
          type: string
        userEmail:
          type: string
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: integer
          format: int64
        oldValue:
          description: Dữ liệu cũ dạng JSON
        newValue:
          description: Dữ liệu mới dạng JSON
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
security:
  - bearerAuth: []

paths:
  /payments/my:
    get:
      tags: [Payments]
      summary: Retrieve the authenticated member's payment history
      description: MEMBER only. The member ID comes from the authenticated principal.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own payment history, including an empty array when no payments exist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/PaymentDto'}
        '401': {description: Authentication required}
        '403': {description: MEMBER role required}
        '404': {description: Member profile not found}
  /payments:
    post:
      tags: [Payments]
      summary: Create a payment request or staff cashier transaction
      description: >
        MEMBER, RECEPTIONIST or CENTER_MANAGER. A MEMBER may only create their own
        pending payment; this never activates a subscription or confirms receipt.
        POST /payments/process and PATCH /payments/{id}/status remain staff operations;
        refunds require CENTER_MANAGER. Those operations are not enabled for MEMBER.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
      responses:
        '201':
          description: Payment created; member requests remain pending
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/PaymentDto'}
        '400': {description: Invalid request, missing payment target, price mismatch or subscription not pending}
        '401': {description: Authentication required}
        '403': {description: Foreign member or payment target, or member attempted payment confirmation/cashier fields}
        '404': {description: Member or payment target not found}
  # ==========================================
  # Notifications Endpoints (SCRUM-67)
  # ==========================================
  /notifications:
    get:
      summary: Lấy danh sách thông báo của người dùng hiện tại (phân trang)
      tags: [Notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/NotificationDto'
        '401':
          description: Chưa xác thực (UNAUTHORIZED)

  /notifications/unread-count:
    get:
      summary: Đếm số lượng thông báo chưa đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UnreadCountDto'
        '401':
          description: Chưa xác thực

  /notifications/{id}/read:
    patch:
      summary: Đánh dấu một thông báo là đã đọc
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thành công
        '404':
          description: Không tìm thấy thông báo

  /notifications/read-all:
    patch:
      summary: Đánh dấu tất cả thông báo của người dùng là đã đọc
      tags: [Notifications]
      responses:
        '200':
          description: Thành công

  # ==========================================
  # Support Requests Endpoints (SCRUM-68)
  # ==========================================
  /support/requests:
    post:
      summary: Tạo phiếu yêu cầu hỗ trợ / khiếu nại mới (Chỉ MEMBER)
      tags: [Support]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportRequestDto'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Dữ liệu không hợp lệ (VALIDATION_ERROR)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

    get:
      summary: Xem toàn bộ danh sách phiếu yêu cầu hỗ trợ (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, resolved, closed]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/my:
    get:
      summary: Lấy lịch sử yêu cầu hỗ trợ của chính hội viên đang đăng nhập (Chỉ MEMBER)
      tags: [Support]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          content:
                            type: array
                            items:
                              $ref: '#/components/schemas/SupportRequestDto'
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)

  /support/requests/{id}/status:
    patch:
      summary: Cập nhật trạng thái phiếu hỗ trợ và người phụ trách (CENTER_MANAGER, RECEPTIONIST)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupportRequestStatusDto'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestDto'
        '400':
          description: Lỗi state machine chuyển trạng thái hoặc validation (INVALID_STATE_TRANSITION)
        '403':
          description: Quyền truy cập bị từ chối (FORBIDDEN)
        '404':
          description: Phiếu hỗ trợ không tồn tại

  /support/requests/{id}/messages:
    post:
      summary: Gui tin nhan phan hoi vao phieu ho tro (SCRUM-106)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportMessageDto'
      responses:
        '200':
          description: Gui tin nhan thanh cong
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SupportRequestMessageDto'
        '400':
          description: Phieu ho tro da dong hoac noi dung tin nhan khong hop le
        '403':
          description: Quyen truy cap bi tu choi (FORBIDDEN)
        '404':
          description: Phieu ho tro khong ton tai
    get:
      summary: Lay toan bo lich su trao doi trong phieu ho tro theo thu tu thoi gian (SCRUM-106)
      tags: [Support]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lay danh sach tin nhan thanh cong
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SupportRequestMessageDto'
        '403':
          description: Quyen truy cap bi tu choi (FORBIDDEN)
        '404':
          description: Phieu ho tro khong ton tai
  # ==========================================
  # Membership Subscriptions (SCRUM-71)
  # ==========================================
  /memberships/subscriptions:
    post:
      summary: Đăng ký gói tập mới đang chờ thanh toán (SCRUM-71)
      tags: [Memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequest'
      responses:
        '201':
