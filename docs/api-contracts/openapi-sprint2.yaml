          description: Buổi học không hợp lệ hoặc đã qua
        '403':
          description: Gói không active/không có hiệu lực hiện tại (SCHEDULING_MEMBERSHIP_INVALID), hoặc gói active hiện tại không bao phủ ngày học (SCHEDULING_MEMBERSHIP_NOT_COVERING_SESSION).
        '409':
          description: Lớp đã đầy chỗ (Trigger P2) hoặc đã đăng ký trước đó

